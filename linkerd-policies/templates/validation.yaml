{{/* Types, required fields and formats are checked by values.schema.json. */}}
{{/* These checks cover relationships between platform inventory and grants. */}}
{{- range $projectName, $project := .Values.platform.projects }}
  {{- range $destinationName := $project.destinations }}
    {{- if not (hasKey $.Values.platform.destinations $destinationName) }}
      {{- fail (printf "platform.projects.%s references unknown destination %s" $projectName $destinationName) }}
    {{- end }}
  {{- end }}
{{- end }}

{{- $grantNames := dict }}
{{- range $projectName, $project := .Values.projects }}
  {{- if not (hasKey $.Values.platform.projects $projectName) }}
    {{- fail (printf "projects.%s is an unregistered project" $projectName) }}
  {{- end }}
  {{- $allowed := index $.Values.platform.projects $projectName }}

  {{- range $destinationName, $grant := $project.grants }}
    {{- $path := printf "projects.%s.grants.%s" $projectName $destinationName }}
    {{- if not (hasKey $.Values.platform.destinations $destinationName) }}
      {{- fail (printf "%s references unknown destination" $path) }}
    {{- end }}
    {{- if not (has $destinationName $allowed.destinations) }}
      {{- fail (printf "%s destination is not allowed for project" $path) }}
    {{- end }}

    {{- range $account := $grant.serviceAccounts }}
      {{- if not (has $account.namespace $allowed.namespaces) }}
        {{- fail (printf "%s source namespace %s is not allowed" $path $account.namespace) }}
      {{- end }}
    {{- end }}

    {{- $name := include "linkerd-policies.grantName" (dict "project" $projectName "destination" $destinationName) }}
    {{- $namespace := (index $.Values.platform.destinations $destinationName).namespace }}
    {{- $key := printf "%s/%s" $namespace $name }}
    {{- if hasKey $grantNames $key }}
      {{- fail (printf "%s has a resource-name collision in namespace %s" $path $namespace) }}
    {{- end }}
    {{- $_ := set $grantNames $key true }}
  {{- end }}
{{- end }}
